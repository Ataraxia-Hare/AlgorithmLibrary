name: .NET Quality Check

on:
    pull_request:
        branches: [ main ]
    push:
        branches: [ main ]

permissions:
    contents: read

jobs:
    quality:
        name: .NET Quality Check
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup .NET SDK
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: '9.0.x'

            -   name: Restore dependencies
                run: dotnet restore AlgorithmLibrary.sln

            -   name: Check code format and style
                run: dotnet format AlgorithmLibrary.sln --no-restore --verify-no-changes

            -   name: Build and analyze
                run: dotnet build AlgorithmLibrary.sln --configuration Release --no-restore -warnaserror

            -   name: Run tests
                run: dotnet test AlgorithmLibrary.sln --configuration Release --no-build
